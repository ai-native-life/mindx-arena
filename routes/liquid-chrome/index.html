<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindX | Liquid Chrome Fluid Ripple 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #030407; font-family: 'Space Grotesk', sans-serif; color: #e2e8f0; }
    #webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: pointer; }
    .bg-vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; background: radial-gradient(circle at 50% 50%, rgba(15, 20, 32, 0) 35%, rgba(3, 4, 7, 0.85) 85%, #030407 100%); }
    .top-hud { position: absolute; top: 20px; left: 28px; right: 28px; z-index: 10; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .brand-block { display: flex; align-items: center; gap: 14px; pointer-events: auto; }
    .brand-badge { width: 10px; height: 10px; background: #fa1c18; border-radius: 50%; box-shadow: 0 0 14px #fa1c18; }
    .brand-title { font-size: 16px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #ffffff; }
    .brand-subtitle { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #64748b; letter-spacing: 0.05em; border-left: 1px solid #1e293b; padding-left: 12px; }
    .top-actions { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
    .hud-btn { background: rgba(12, 18, 30, 0.75); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(16px); color: #e2e8f0; padding: 8px 14px; border-radius: 8px; font-size: 11px; font-family: 'JetBrains Mono', monospace; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; }
    .hud-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); color: #ffffff; transform: translateY(-1px); }
    .hud-btn.active { background: #fa1c18; border-color: #fa1c18; color: #ffffff; box-shadow: 0 0 16px rgba(250, 28, 24, 0.4); }
    .bottom-hud { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
    .control-bar { pointer-events: auto; background: rgba(10, 15, 26, 0.85); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px); padding: 6px; border-radius: 14px; display: flex; gap: 6px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7); }
    .ctrl-btn { background: transparent; border: 1px solid transparent; color: #94a3b8; padding: 9px 16px; border-radius: 10px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 8px; }
    .ctrl-btn:hover { color: #ffffff; background: rgba(255, 255, 255, 0.08); }
    .ctrl-btn.active { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.25); color: #ffffff; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); }
    .action-dock { position: absolute; right: 28px; top: 50%; transform: translateY(-50%); z-index: 10; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
    .dock-btn { width: 44px; height: 44px; background: rgba(10, 15, 26, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border-radius: 10px; color: #94a3b8; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; font-size: 16px; position: relative; }
    .dock-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); color: #ffffff; }
    .dock-btn.active { background: #fa1c18; border-color: #fa1c18; color: #ffffff; box-shadow: 0 0 16px rgba(250, 28, 24, 0.4); }
    .dock-tooltip { position: absolute; right: 52px; background: rgba(6, 8, 12, 0.95); border: 1px solid rgba(255, 255, 255, 0.15); padding: 4px 8px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; white-space: nowrap; pointer-events: none; opacity: 0; transform: translateX(6px); transition: all 0.2s ease; color: #e2e8f0; }
    .dock-btn:hover .dock-tooltip { opacity: 1; transform: translateX(0); }
    .info-overlay { position: absolute; left: 28px; bottom: 24px; z-index: 10; pointer-events: none; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #475569; line-height: 1.7; }
    .info-overlay span { color: #94a3b8; }
    .instruction-toast { position: absolute; top: 68px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(10, 15, 26, 0.65); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); padding: 5px 14px; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #94a3b8; pointer-events: none; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div id="webgl-container"></div>
  <div class="bg-vignette"></div>
  <div class="top-hud">
    <div class="brand-block">
      <div class="brand-badge"></div>
      <div class="brand-title">MindX Liquid Fluid Ripple</div>
      <div class="brand-subtitle">T-1000 LIQUID CHROME // SURFACE WAVE SHADERS</div>
    </div>
    <div class="top-actions">
      <button class="hud-btn" id="btn-melt" title="液态融化 / 凝固">💧 MELT / SOLIDIFY (M)</button>
      <button class="hud-btn" id="btn-snapshot" title="导出4K快照">📸 SNAPSHOT</button>
      <button class="hud-btn" id="btn-reset" title="重置视角">↺ RESET</button>
    </div>
  </div>
  <div class="instruction-toast">
    CLICK OR HOVER LOGO TO CAST MERCURY RIPPLES // DRAG TO ROTATE 360°
  </div>
  <div class="action-dock">
    <button class="dock-btn" id="btn-rotate" title="自转巡航">⟳<span class="dock-tooltip">Auto Rotate (Space)</span></button>
    <button class="dock-btn" id="btn-highwave" title="狂暴冲击波">🌊<span class="dock-tooltip">High Waves (W)</span></button>
    <button class="dock-btn" id="btn-organic" title="呼吸有机律动">∿<span class="dock-tooltip">Organic Breath</span></button>
  </div>
  <div class="bottom-hud">
    <div class="control-bar">
      <button class="ctrl-btn active" data-style="mercury">
        <span style="width:8px;height:8px;border-radius:50%;background:#ffffff;box-shadow:0 0 8px #ffffff;"></span>
        Pure Mercury Chrome
      </button>
      <button class="ctrl-btn" data-style="crimson">
        <span style="width:8px;height:8px;border-radius:50%;background:#fa1c18;box-shadow:0 0 8px #fa1c18;"></span>
        Laser Blood Ruby
      </button>
      <button class="ctrl-btn" data-style="gold">
        <span style="width:8px;height:8px;border-radius:50%;background:#fbbf24;box-shadow:0 0 8px #fbbf24;"></span>
        Molten 24K Gold
      </button>
      <button class="ctrl-btn" data-style="cyber">
        <span style="width:8px;height:8px;border-radius:50%;background:#38bdf8;box-shadow:0 0 8px #38bdf8;"></span>
        Bioluminescent Gel
      </button>
    </div>
  </div>
  <div class="info-overlay">
    <div>SURFACE: <span>T-1000 Dynamic Viscous Mercury</span></div>
    <div>WAVE FORMULA: <span>sin(dist*5 - time*8) * exp(-dist)</span></div>
    <div>STATE: <span id="liquid-state">ORGANIC EQUILIBRIUM</span></div>
  </div>

  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/SVGLoader.js"></script>
  <script src="./vendor/OrbitControls.js"></script>
  <script src="./vendor/tween.umd.js"></script>
  <script>
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030407);

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
    const DEFAULT_CAM_POS = new THREE.Vector3(0, 0.5, 23);
    camera.position.copy(DEFAULT_CAM_POS);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);
    controls.minDistance = 5;
    controls.maxDistance = 60;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 1.2;

    function generateStudioEnvironment() {
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();

      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bgGrad.addColorStop(0, '#0a0e17');
      bgGrad.addColorStop(0.5, '#030508');
      bgGrad.addColorStop(1, '#010204');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const topGrad = ctx.createRadialGradient(512, 100, 10, 512, 100, 220);
      topGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      topGrad.addColorStop(0.4, 'rgba(240, 245, 255, 0.85)');
      topGrad.addColorStop(1, 'rgba(200, 220, 255, 0)');
      ctx.fillStyle = topGrad;
      ctx.fillRect(0, 0, canvas.width, 320);

      const leftGrad = ctx.createLinearGradient(120, 150, 240, 350);
      leftGrad.addColorStop(0, 'rgba(180, 220, 255, 0.85)');
      leftGrad.addColorStop(1, 'rgba(100, 150, 255, 0)');
      ctx.fillStyle = leftGrad;
      ctx.fillRect(80, 100, 200, 300);

      const rightGrad = ctx.createLinearGradient(880, 150, 760, 350);
      rightGrad.addColorStop(0, 'rgba(255, 80, 90, 0.9)');
      rightGrad.addColorStop(0.5, 'rgba(255, 180, 190, 0.3)');
      rightGrad.addColorStop(1, 'rgba(255, 100, 120, 0)');
      ctx.fillStyle = rightGrad;
      ctx.fillRect(720, 100, 240, 300);

      const texture = new THREE.CanvasTexture(canvas);
      const envMap = pmremGenerator.fromEquirectangular(texture).texture;
      pmremGenerator.dispose();
      return envMap;
    }

    const studioEnvMap = generateStudioEnvironment();
    scene.environment = studioEnvMap;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const mouseSpot = new THREE.SpotLight(0xffffff, 3.5, 50, Math.PI / 3, 0.4, 1.2);
    mouseSpot.position.set(0, 8, 20);
    scene.add(mouseSpot);

    const rimBlue = new THREE.DirectionalLight(0x38bdf8, 2.5);
    rimBlue.position.set(-14, 10, -10);
    scene.add(rimBlue);

    const rimRed = new THREE.DirectionalLight(0xfa1c18, 3.0);
    rimRed.position.set(14, -6, -8);
    scene.add(rimRed);

    const gridHelper = new THREE.GridHelper(50, 30, 0x1e293b, 0x090d16);
    gridHelper.position.y = -5.8;
    scene.add(gridHelper);

    const customUniforms = {
      uTime: { value: 0 },
      uMousePos: { value: new THREE.Vector2(9999, 9999) },
      uRippleIntensity: { value: 0.35 },
      uMeltFactor: { value: 0.0 }
    };

    function createLiquidMaterial(colorHex, metalness, roughness) {
      const mat = new THREE.MeshStandardMaterial({
        color: colorHex,
        metalness: metalness || 0.98,
        roughness: roughness || 0.04,
        envMap: studioEnvMap,
        envMapIntensity: 2.5
      });

      mat.onBeforeCompile = function(shader) {
        shader.uniforms.uTime = customUniforms.uTime;
        shader.uniforms.uMousePos = customUniforms.uMousePos;
        shader.uniforms.uRippleIntensity = customUniforms.uRippleIntensity;
        shader.uniforms.uMeltFactor = customUniforms.uMeltFactor;

        shader.vertexShader = [
          'uniform float uTime;',
          'uniform vec2 uMousePos;',
          'uniform float uRippleIntensity;',
          'uniform float uMeltFactor;',
          shader.vertexShader
        ].join('\n');

        shader.vertexShader = shader.vertexShader.replace(
          '#include <begin_vertex>',
          [
            '#include <begin_vertex>',
            'float d = distance(transformed.xy, uMousePos);',
            'float ripple = sin(d * 4.5 - uTime * 9.0) * exp(-d * 0.45) * uRippleIntensity;',
            'float idle = sin(transformed.x * 0.8 + uTime * 2.0) * cos(transformed.y * 0.8 + uTime * 1.5) * 0.08;',
            'float melt = sin(transformed.x * 2.0 + uTime * 3.0) * uMeltFactor * 0.8;',
            'transformed.z += ripple + idle;',
            'transformed.y -= uMeltFactor * (transformed.y + 4.37) * 0.35;',
            'transformed.x += melt * 0.2;'
          ].join('\n')
        );
      };

      return mat;
    }

    const materialStyles = {
      mercury: {
        body: createLiquidMaterial(0xebf2fa, 0.98, 0.03),
        accent: createLiquidMaterial(0xff1420, 0.95, 0.04)
      },
      crimson: {
        body: createLiquidMaterial(0x990011, 0.92, 0.06),
        accent: createLiquidMaterial(0xff3355, 0.98, 0.02)
      },
      gold: {
        body: createLiquidMaterial(0xf5bf26, 0.96, 0.08),
        accent: createLiquidMaterial(0xa80518, 0.92, 0.05)
      },
      cyber: {
        body: createLiquidMaterial(0x0f172a, 0.85, 0.12),
        accent: createLiquidMaterial(0x38bdf8, 0.95, 0.02)
      }
    };
    let currentStyleKey = 'mercury';

    const logoGroup = new THREE.Group();
    scene.add(logoGroup);

    const rawSvgStr = document.getElementById('raw-svg').innerHTML;
    const svgLoader = new THREE.SVGLoader();
    const svgData = svgLoader.parse(rawSvgStr);

    const origMinX = 5, origMaxX = 809;
    const origMinY = 0, origMaxY = 439;
    const origWidth = origMaxX - origMinX;
    const cx = (origMinX + origMaxX) / 2;
    const cy = (origMinY + origMaxY) / 2;

    const targetWidth = 16.0;
    const normScale = targetWidth / origWidth;
    const origDepth = 75;

    const normMatrix = new THREE.Matrix4();
    normMatrix.makeScale(normScale, -normScale, normScale);
    normMatrix.multiply(new THREE.Matrix4().makeTranslation(-cx, -cy, -origDepth / 2));

    const extrudeSettings = {
      depth: origDepth,
      bevelEnabled: true,
      bevelSegments: 8,
      bevelSize: 11,
      bevelThickness: 14,
      curveSegments: 32
    };

    const meshesBody = [];
    const meshesAccent = [];

    svgData.paths.forEach((path) => {
      const fillColor = path.userData.style.fill;
      const isRedAccent = (fillColor === '#fa1c18' || fillColor === 'rgb(250, 28, 24)');
      const shapes = THREE.SVGLoader.createShapes(path);

      shapes.forEach((shape) => {
        const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geom.applyMatrix4(normMatrix);
        geom.computeVertexNormals();

        let mat = isRedAccent ? materialStyles[currentStyleKey].accent : materialStyles[currentStyleKey].body;
        const mesh = new THREE.Mesh(geom, mat);
        if (isRedAccent) {
          meshesAccent.push(mesh);
        } else {
          meshesBody.push(mesh);
        }
        mesh.castShadow = true;
        logoGroup.add(mesh);
      });
    });

    const raycaster = new THREE.Raycaster();
    const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const mousePlanePos = new THREE.Vector3();
    const mouseCoord = new THREE.Vector2();

    window.addEventListener('pointermove', (e) => {
      mouseCoord.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouseCoord.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouseCoord, camera);
      raycaster.ray.intersectPlane(planeZ, mousePlanePos);

      customUniforms.uMousePos.value.set(mousePlanePos.x, mousePlanePos.y);
      mouseSpot.position.x = mouseCoord.x * 15;
      mouseSpot.position.y = 8 + mouseCoord.y * 8;
    });

    window.addEventListener('pointerdown', () => {
      new TWEEN.Tween(customUniforms.uRippleIntensity)
        .to({ value: 0.85 }, 200)
        .easing(TWEEN.Easing.Cubic.Out)
        .chain(
          new TWEEN.Tween(customUniforms.uRippleIntensity)
            .to({ value: 0.35 }, 600)
            .easing(TWEEN.Easing.Cubic.In)
        )
        .start();
    });

    let isMelted = false;
    const btnMelt = document.getElementById('btn-melt');
    btnMelt.addEventListener('click', toggleMelt);

    function toggleMelt() {
      isMelted = !isMelted;
      btnMelt.classList.toggle('active', isMelted);
      document.getElementById('liquid-state').innerText = isMelted ? 'MOLTEN T-1000 STATE' : 'SOLID TITANIUM ALLOY';

      new TWEEN.Tween(customUniforms.uMeltFactor)
        .to({ value: isMelted ? 1.0 : 0.0 }, 1000)
        .easing(TWEEN.Easing.Cubic.InOut)
        .start();
    }

    function applyStyle(key) {
      currentStyleKey = key;
      const s = materialStyles[key];

      meshesBody.forEach(m => {
        m.material = s.body;
        m.material.needsUpdate = true;
      });
      meshesAccent.forEach(m => {
        m.material = s.accent;
        m.material.needsUpdate = true;
      });

      document.querySelectorAll('.ctrl-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.style === key);
      });
    }

    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      btn.addEventListener('click', () => applyStyle(btn.dataset.style));
    });

    const btnRotate = document.getElementById('btn-rotate');
    btnRotate.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      btnRotate.classList.toggle('active', controls.autoRotate);
    });

    let highWaveActive = false;
    const btnHighwave = document.getElementById('btn-highwave');
    btnHighwave.addEventListener('click', () => {
      highWaveActive = !highWaveActive;
      btnHighwave.classList.toggle('active', highWaveActive);
      customUniforms.uRippleIntensity.value = highWaveActive ? 0.75 : 0.35;
    });

    let organicBreath = false;
    const btnOrganic = document.getElementById('btn-organic');
    btnOrganic.addEventListener('click', () => {
      organicBreath = !organicBreath;
      btnOrganic.classList.toggle('active', organicBreath);
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      new TWEEN.Tween(camera.position)
        .to(DEFAULT_CAM_POS, 800)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();
      new TWEEN.Tween(controls.target)
        .to({ x: 0, y: 0, z: 0 }, 800)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();
    });

    document.getElementById('btn-snapshot').addEventListener('click', () => {
      const origSize = new THREE.Vector2();
      renderer.getSize(origSize);
      
      renderer.setSize(3840, 2160);
      camera.aspect = 3840 / 2160;
      camera.updateProjectionMatrix();
      renderer.render(scene, camera);

      const link = document.createElement('a');
      link.download = 'MindX_Liquid_Chrome_4K.png';
      link.href = renderer.domElement.toDataURL('image/png');
      link.click();

      renderer.setSize(origSize.x, origSize.y);
      camera.aspect = origSize.x / origSize.y;
      camera.updateProjectionMatrix();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'm' || e.key === 'M') toggleMelt();
      if (e.code === 'Space') {
        controls.autoRotate = !controls.autoRotate;
        btnRotate.classList.toggle('active', controls.autoRotate);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      TWEEN.update();
      controls.update();

      const elapsed = clock.getElapsedTime();
      customUniforms.uTime.value = elapsed;

      if (organicBreath) {
        logoGroup.position.y = Math.sin(elapsed * 1.4) * 0.35;
        logoGroup.rotation.z = Math.sin(elapsed * 0.9) * 0.02;
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>

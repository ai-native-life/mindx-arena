<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindX | Pure 3D Interactive Logo Studio (Centered & Fully Scaled)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040507;
      font-family: 'Space Grotesk', sans-serif;
      color: #e2e8f0;
    }
    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }
    #webgl-container:active {
      cursor: grabbing;
    }

    .bg-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(18, 22, 32, 0) 35%, rgba(4, 5, 7, 0.8) 85%, #040507 100%);
    }

    /* Top Navigation HUD */
    .top-hud {
      position: absolute;
      top: 20px;
      left: 28px;
      right: 28px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .brand-block {
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
    }
    .brand-badge {
      width: 10px;
      height: 10px;
      background: #fa1c18;
      border-radius: 50%;
      box-shadow: 0 0 12px #fa1c18;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffffff;
    }
    .brand-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.05em;
      border-left: 1px solid #1e293b;
      padding-left: 12px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }
    .hud-btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .hud-btn.active {
      background: #fa1c18;
      border-color: #fa1c18;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(250, 28, 24, 0.4);
    }

    /* Preset Viewports Bar (Top Center) */
    .view-presets-bar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 6px;
      background: rgba(12, 16, 25, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      padding: 4px;
      border-radius: 10px;
      pointer-events: auto;
    }
    .view-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .view-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }
    .view-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Bottom Material Switcher */
    .bottom-hud {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .material-bar {
      pointer-events: auto;
      background: rgba(12, 16, 25, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      padding: 6px;
      border-radius: 14px;
      display: flex;
      gap: 6px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .mat-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mat-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }
    .mat-btn.active {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .mat-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    /* Floating Tool Controls (Right side) */
    .tool-dock {
      position: absolute;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
    }
    .tool-btn {
      width: 44px;
      height: 44px;
      background: rgba(12, 16, 25, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border-radius: 10px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 16px;
      position: relative;
    }
    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
    }
    .tool-btn.active {
      background: #fa1c18;
      border-color: #fa1c18;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(250, 28, 24, 0.4);
    }
    .tool-tooltip {
      position: absolute;
      right: 52px;
      background: rgba(8, 10, 14, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateX(6px);
      transition: all 0.2s ease;
      color: #e2e8f0;
    }
    .tool-btn:hover .tool-tooltip {
      opacity: 1;
      transform: translateX(0);
    }

    /* Left Stats / Geometry Info */
    .info-overlay {
      position: absolute;
      left: 28px;
      bottom: 24px;
      z-index: 10;
      pointer-events: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #475569;
      line-height: 1.7;
    }
    .info-overlay span {
      color: #94a3b8;
    }

    .instruction-toast {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(12, 16, 25, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 5px 14px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #94a3b8;
      pointer-events: none;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <!-- 3D Canvas -->
  <div id="webgl-container"></div>
  <div class="bg-vignette"></div>

  <!-- Top HUD -->
  <div class="top-hud">
    <div class="brand-block">
      <div class="brand-badge"></div>
      <div class="brand-title">MindX 3D Studio</div>
      <div class="brand-subtitle">CENTERED VOLUMETRIC MESH // FULL-BOUNDS FIT</div>
    </div>

    <!-- View Preset Switchers -->
    <div class="view-presets-bar">
      <button class="view-btn active" data-view="front">正面全貌 (Front)</button>
      <button class="view-btn" data-view="iso">3D 黄金角 (Isometric)</button>
      <button class="view-btn" data-view="macro">微距特写 (Macro X)</button>
      <button class="view-btn" data-view="top">俯视平面 (Top)</button>
    </div>

    <div class="top-actions">
      <button class="hud-btn" id="btn-snapshot" title="4K透明PNG快照">
        📸 SNAPSHOT
      </button>
      <button class="hud-btn" id="btn-reset" title="重置视角">
        ↺ RESET
      </button>
    </div>
  </div>

  <div class="instruction-toast">
    DRAG: ROTATE 360° // WHEEL: ZOOM // RIGHT-CLICK: PAN // HOVER: LIGHT REFLECTION
  </div>

  <!-- Right Floating Tool Dock -->
  <div class="tool-dock">
    <button class="tool-btn" id="btn-rotate" title="自转巡航">
      ⟳
      <span class="tool-tooltip">Auto Rotate (Space)</span>
    </button>
    <button class="tool-btn" id="btn-explode" title="零件拆解/装配">
      ⇲
      <span class="tool-tooltip">Explode Layers (E)</span>
    </button>
    <button class="tool-btn" id="btn-wireframe" title="线框工程模式">
      ⌗
      <span class="tool-tooltip">Wireframe (W)</span>
    </button>
    <button class="tool-btn" id="btn-hover" title="浮动悬停">
      ∿
      <span class="tool-tooltip">Floating Motion</span>
    </button>
  </div>

  <!-- Bottom Material Switcher -->
  <div class="bottom-hud">
    <div class="material-bar">
      <button class="mat-btn active" data-preset="chrome">
        <span class="mat-dot" style="background: linear-gradient(135deg, #fff, #94a3b8);"></span>
        Liquid Chrome
      </button>
      <button class="mat-btn" data-preset="glass">
        <span class="mat-dot" style="background: radial-gradient(circle, #e0f2fe, #38bdf8);"></span>
        Prism Crystal Glass
      </button>
      <button class="mat-btn" data-preset="obsidian">
        <span class="mat-dot" style="background: linear-gradient(135deg, #1e293b, #090d16); border: 1px solid #fa1c18;"></span>
        Cyber Obsidian & Neon
      </button>
      <button class="mat-btn" data-preset="gold">
        <span class="mat-dot" style="background: linear-gradient(135deg, #fbbf24, #b45309);"></span>
        24K Gold & Ruby
      </button>
      <button class="mat-btn" data-preset="wireframe">
        <span class="mat-dot" style="background: #38bdf8;"></span>
        Quantum Blueprint
      </button>
    </div>
  </div>

  <!-- Left Stats Info -->
  <div class="info-overlay">
    <div>BOUNDS: <span>[-8.00, +8.00] x [-4.37, +4.37]</span></div>
    <div>CENTER: <span>(0.00, 0.00, 0.00) MATHEMATICAL PIVOT</span></div>
    <div>ACTIVE SHADER: <span id="shader-label">Liquid Chrome PBR</span></div>
    <div>STATUS: <span id="status-label">FRONTAL OVERVIEW READY</span></div>
  </div>

    // --- 1. Scene, Camera, Renderer ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040507);

    // Camera setup: standard 35 degree FOV for architectural perfection
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
    // Standard initial front view distance (width=16, fit at z=24)
    const DEFAULT_CAM_POS = new THREE.Vector3(0, 0.5, 24);
    camera.position.copy(DEFAULT_CAM_POS);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 0, 0); // Mathematical exact center
    controls.minDistance = 5;
    controls.maxDistance = 65;
    controls.autoRotate = false; // Start static for clear overview
    controls.autoRotateSpeed = 1.2;

    // --- 2. Procedural Studio Environment Map (Softboxes) ---
    function generateStudioEnvironment() {
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();

      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bgGrad.addColorStop(0, '#0a0e17');
      bgGrad.addColorStop(0.5, '#040609');
      bgGrad.addColorStop(1, '#010204');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Top Softbox
      const topGrad = ctx.createRadialGradient(512, 100, 10, 512, 100, 220);
      topGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      topGrad.addColorStop(0.4, 'rgba(240, 245, 255, 0.8)');
      topGrad.addColorStop(1, 'rgba(200, 220, 255, 0)');
      ctx.fillStyle = topGrad;
      ctx.fillRect(0, 0, canvas.width, 320);

      // Left Soft Strip Light
      const leftGrad = ctx.createLinearGradient(120, 150, 240, 350);
      leftGrad.addColorStop(0, 'rgba(180, 220, 255, 0.85)');
      leftGrad.addColorStop(1, 'rgba(100, 150, 255, 0)');
      ctx.fillStyle = leftGrad;
      ctx.fillRect(80, 100, 200, 300);

      // Right Rim Light with Crimson Touch
      const rightGrad = ctx.createLinearGradient(880, 150, 760, 350);
      rightGrad.addColorStop(0, 'rgba(255, 80, 90, 0.9)');
      rightGrad.addColorStop(0.5, 'rgba(255, 180, 190, 0.3)');
      rightGrad.addColorStop(1, 'rgba(255, 100, 120, 0)');
      ctx.fillStyle = rightGrad;
      ctx.fillRect(720, 100, 240, 300);

      const texture = new THREE.CanvasTexture(canvas);
      const envMap = pmremGenerator.fromEquirectangular(texture).texture;
      pmremGenerator.dispose();
      return envMap;
    }

    const studioEnvMap = generateStudioEnvironment();
    scene.environment = studioEnvMap;

    scene.add(ambientLight);

    const mouseSpot = new THREE.SpotLight(0xffffff, 3.2, 50, Math.PI / 3, 0.4, 1.2);
    mouseSpot.position.set(0, 8, 20);

    const rimBlue = new THREE.DirectionalLight(0x38bdf8, 2.2);
    rimBlue.position.set(-12, 10, -10);

    gridHelper.position.y = -5.8;

    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x040507,
      roughness: 0.3,
      metalness: 0.8,
      envMap: studioEnvMap,
      envMapIntensity: 0.5
    });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.y = -5.85;

          color: 0x38bdf8,
          wireframe: true,
          metalness: 0.5,
          roughness: 0.2
        }),
        accent: new THREE.MeshStandardMaterial({
          color: 0xfa1c18,
          wireframe: true,
          metalness: 0.5,
          roughness: 0.2
        })
      }
    };

    let currentPresetKey = 'chrome';
    let isWireframeActive = false;
    let isExploded = false;
    let floatingEnabled = false;

    // --- 5. Mathematical Normalization & Geometry Transformation ---
    const logoPivot = new THREE.Group(); // Mathematical pivot at (0,0,0)
    scene.add(logoPivot);

    const groupIcon = new THREE.Group();
    const groupText = new THREE.Group();
    const groupAccent = new THREE.Group();
    logoPivot.add(groupIcon);
    logoPivot.add(groupText);
    logoPivot.add(groupAccent);

    // Parsing SVG
    const rawSvgStr = document.getElementById('raw-svg').innerHTML;
    const svgLoader = new THREE.SVGLoader();
    const svgData = svgLoader.parse(rawSvgStr);

    // Exact Bounding Box of original SVG: x in [5, 809], y in [0, 439]
    const origMinX = 5, origMaxX = 809;
    const origMinY = 0, origMaxY = 439;
    const origWidth = origMaxX - origMinX; // 804
    const origHeight = origMaxY - origMinY; // 439
    const cx = (origMinX + origMaxX) / 2; // 407
    const cy = (origMinY + origMaxY) / 2; // 219.5

    // Normalize to target 3D width of 16.0 units
    const targetWidth = 16.0;
    const normScale = targetWidth / origWidth; // ~0.0199
    const origDepth = 75; // Depth in original space -> becomes 75 * 0.0199 = 1.49 units in 3D

    // Matrix to transform raw vertices:
    // 1. Shift center to (0, 0, 0): translate(-cx, -cy, -origDepth / 2)
    // 2. Scale & Flip Y: scale(normScale, -normScale, normScale)
    const normMatrix = new THREE.Matrix4();
    normMatrix.makeScale(normScale, -normScale, normScale);
    normMatrix.multiply(new THREE.Matrix4().makeTranslation(-cx, -cy, -origDepth / 2));

    const extrudeSettings = {
      depth: origDepth,
      bevelEnabled: true,
      bevelSegments: 6,
      bevelSize: 11,        // ~0.22 units in 3D
      bevelThickness: 14,   // ~0.28 units in 3D
      curveSegments: 28
    };

    const meshesBody = [];
    const meshesAccent = [];

    svgData.paths.forEach((path) => {
      const fillColor = path.userData.style.fill;
      const isRedAccent = (fillColor === '#fa1c18' || fillColor === 'rgb(250, 28, 24)');
      const shapes = THREE.SVGLoader.createShapes(path);

      shapes.forEach((shape) => {
        const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        
        // Apply mathematical normalization matrix directly to vertex buffer!
        geom.applyMatrix4(normMatrix);
        geom.computeVertexNormals();
        geom.computeBoundingBox();

        // Determine icon vs text by checking X position after transformation
        const meshMinX = geom.boundingBox.min.x;

        let mat;
        let targetMesh;
        if (isRedAccent) {
          mat = materialPresets[currentPresetKey].accent;
          targetMesh = new THREE.Mesh(geom, mat);
          meshesAccent.push(targetMesh);
          groupAccent.add(targetMesh);
        } else {
          mat = materialPresets[currentPresetKey].body;
          targetMesh = new THREE.Mesh(geom, mat);
          meshesBody.push(targetMesh);
          if (meshMinX < -1.0) {
            groupIcon.add(targetMesh);
          } else {
            groupText.add(targetMesh);
          }
        }
        targetMesh.castShadow = true;
        targetMesh.receiveShadow = true;
      });
    });

    // --- 6. Viewport Presets Switching ---
    const viewPositions = {
      front: { pos: new THREE.Vector3(0, 0.5, 24), target: new THREE.Vector3(0, 0, 0) },
      iso: { pos: new THREE.Vector3(14, 9, 18), target: new THREE.Vector3(0, 0, 0) },
      macro: { pos: new THREE.Vector3(5.5, -0.8, 8), target: new THREE.Vector3(5.5, -1.0, 0) }, // Focus directly on red X!
      top: { pos: new THREE.Vector3(0, 24, 0.1), target: new THREE.Vector3(0, 0, 0) }
    };

    function setViewPreset(viewKey) {
      const targetView = viewPositions[viewKey];
      if (!targetView) return;

      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === viewKey);
      });

      new TWEEN.Tween(camera.position)
        .to(targetView.pos, 900)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      new TWEEN.Tween(controls.target)
        .to(targetView.target, 900)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();
    }

    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => setViewPreset(btn.dataset.view));
    });

    // --- 7. Materials & Tool Logic ---
    function applyMaterialPreset(key) {
      currentPresetKey = key;
      const preset = materialPresets[key];
      document.getElementById('shader-label').innerText = preset.name;

      meshesBody.forEach(m => {
        m.material = preset.body;
        m.material.wireframe = isWireframeActive || (key === 'wireframe');
        m.material.needsUpdate = true;
      });
      meshesAccent.forEach(m => {
        m.material = preset.accent;
        m.material.wireframe = isWireframeActive || (key === 'wireframe');
        m.material.needsUpdate = true;
      });

      document.querySelectorAll('.mat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.preset === key);
      });
    }

    document.querySelectorAll('.mat-btn').forEach(btn => {
      btn.addEventListener('click', () => applyMaterialPreset(btn.dataset.preset));
    });

    // Toggle Auto Rotate
    const btnRotate = document.getElementById('btn-rotate');
    btnRotate.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      btnRotate.classList.toggle('active', controls.autoRotate);
    });

    // Toggle Wireframe
    const btnWireframe = document.getElementById('btn-wireframe');
    btnWireframe.addEventListener('click', () => {
      isWireframeActive = !isWireframeActive;
      btnWireframe.classList.toggle('active', isWireframeActive);
      meshesBody.forEach(m => m.material.wireframe = isWireframeActive);
      meshesAccent.forEach(m => m.material.wireframe = isWireframeActive);
    });

    // Toggle Floating
    const btnHover = document.getElementById('btn-hover');
    btnHover.addEventListener('click', () => {
      floatingEnabled = !floatingEnabled;
      btnHover.classList.toggle('active', floatingEnabled);
    });

    // Explode Layers Animation (TWEEN)
    const btnExplode = document.getElementById('btn-explode');
    btnExplode.addEventListener('click', toggleExplode);

    function toggleExplode() {
      isExploded = !isExploded;
      btnExplode.classList.toggle('active', isExploded);

      const targetZ_Icon = isExploded ? 2.8 : 0;
      const targetX_Icon = isExploded ? -1.5 : 0;
      const targetZ_Text = isExploded ? -1.5 : 0;
      const targetZ_Accent = isExploded ? 4.2 : 0;
      const targetX_Accent = isExploded ? 1.4 : 0;
      const targetRotY_Accent = isExploded ? 0.35 : 0;

      new TWEEN.Tween(groupIcon.position)
        .to({ z: targetZ_Icon, x: targetX_Icon }, 900)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      new TWEEN.Tween(groupText.position)
        .to({ z: targetZ_Text }, 900)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      new TWEEN.Tween(groupAccent.position)
        .to({ z: targetZ_Accent, x: targetX_Accent }, 900)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      new TWEEN.Tween(groupAccent.rotation)
        .to({ y: targetRotY_Accent }, 900)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();
    }

    // Reset View
    document.getElementById('btn-reset').addEventListener('click', () => {
      setViewPreset('front');
    });

    // 4K Snapshot
    document.getElementById('btn-snapshot').addEventListener('click', () => {
      const origSize = new THREE.Vector2();
      renderer.getSize(origSize);
      
      renderer.setSize(3840, 2160);
      camera.aspect = 3840 / 2160;
      camera.updateProjectionMatrix();
      renderer.render(scene, camera);

      const link = document.createElement('a');
      link.download = 'MindX_3D_Logo_4K.png';
      link.href = renderer.domElement.toDataURL('image/png');
      link.click();

      renderer.setSize(origSize.x, origSize.y);
      camera.aspect = origSize.x / origSize.y;
      camera.updateProjectionMatrix();
    });

    // Mouse Light Follower
    window.addEventListener('pointermove', (e) => {
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = -(e.clientY / window.innerHeight) * 2 + 1;
      mouseSpot.position.x = x * 15;
      mouseSpot.position.y = 8 + y * 8;
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === '1') applyMaterialPreset('chrome');
      if (e.key === '2') applyMaterialPreset('glass');
      if (e.key === '3') applyMaterialPreset('obsidian');
      if (e.key === '4') applyMaterialPreset('gold');
      if (e.key === '5') applyMaterialPreset('wireframe');
      if (e.code === 'Space') {
        controls.autoRotate = !controls.autoRotate;
        btnRotate.classList.toggle('active', controls.autoRotate);
      }
      if (e.key === 'e' || e.key === 'E') toggleExplode();
      if (e.key === 'w' || e.key === 'W') {
        isWireframeActive = !isWireframeActive;
        btnWireframe.classList.toggle('active', isWireframeActive);
        meshesBody.forEach(m => m.material.wireframe = isWireframeActive);
        meshesAccent.forEach(m => m.material.wireframe = isWireframeActive);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 8. Render Loop ---
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      TWEEN.update();
      controls.update();

      const elapsed = clock.getElapsedTime();

      // Floating Motion
      if (floatingEnabled) {
        logoPivot.position.y = Math.sin(elapsed * 1.5) * 0.4;
        logoPivot.rotation.z = Math.sin(elapsed * 1.0) * 0.015;
      }

      dustParticles.rotation.y = elapsed * 0.015;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
